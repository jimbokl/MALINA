name: Site checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
      - name: Verify catalog and selector
        run: |
          cargo test --manifest-path crates/catalog_tool/Cargo.toml
          cargo test --manifest-path crates/selector/Cargo.toml
          cargo test --manifest-path crates/review_api/Cargo.toml
          python3 -m unittest discover -s db/tests -v
      - name: Build production-shaped site
        env:
          SITE_URL: https://malinaklubnika.ru
          SITE_BASE: /
        run: npm run build
      - run: npm test
