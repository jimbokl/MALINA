name: Publish informational site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 1,7,13,19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked
      - name: Refresh Admitad catalog and offers
        env:
          ADMITAD_FEED_URL: ${{ secrets.ADMITAD_FEED_URL }}
          ADMITAD_FEED_URL_GARSHINKA: ${{ secrets.ADMITAD_FEED_URL_GARSHINKA }}
        run: node site/scripts/admitad-feed.mjs
      - name: Refresh Admitad coupons
        env:
          ADMITAD_COUPONS_URL_GARSHINKA: ${{ secrets.ADMITAD_COUPONS_URL_GARSHINKA }}
          ADMITAD_COUPONS_URL_AGROSEMFOND: ${{ secrets.ADMITAD_COUPONS_URL_AGROSEMFOND }}
        run: node site/scripts/admitad-coupons.mjs
      - name: Build informational site
        env:
          SITE_URL: https://malinaklubnika.ru
          SITE_BASE: /
          YM_COUNTER_ID: 113131045
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
          VOTE_API_URL: ${{ vars.VOTE_API_URL }}
        run: npm run build
      - name: Verify generated pages and catalog
        run: npm test
      - name: Save refreshed catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add site/shop-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='MALINA catalog bot' -c user.email='actions@users.noreply.github.com' commit -m 'Refresh Admitad shop catalog'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
