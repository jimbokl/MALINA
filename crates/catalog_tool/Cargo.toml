[package]
name = "malina-catalog-tool"
version = "0.1.0"
edition = "2021"
description = "Build-time SQLite catalog pipeline for malinaklubnika.ru"
license = "MIT"

[dependencies]
anyhow = "1"
csv = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
