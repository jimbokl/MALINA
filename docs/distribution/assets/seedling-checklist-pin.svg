<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title desc">
  <title id="title">Саженцы клубники: три вопроса продавцу</title>
  <desc id="desc">Перед покупкой уточните название сорта, формат растения и происхождение партии. Проверьте основания для заявлений о здоровье посадочного материала.</desc>
  <rect width="1000" height="1500" fill="#f7f3e9"/>
  <circle cx="887" cy="111" r="84" fill="#dfe7d3"/>
  <circle cx="917" cy="82" r="21" fill="#a84356"/>
  <path d="M881 76c-37 1-52-17-54-39 30-1 49 13 54 39Zm5 5c1-34 17-49 38-52 2 27-13 45-38 52Z" fill="#263f31"/>
  <text x="82" y="123" fill="#718270" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">ПЕРЕД ПОКУПКОЙ</text>
  <text x="78" y="248" fill="#33111c" font-family="Georgia,serif" font-size="73" font-weight="700">Саженцы</text>
  <text x="78" y="335" fill="#33111c" font-family="Georgia,serif" font-size="73" font-weight="700">клубники:</text>
  <text x="78" y="422" fill="#33111c" font-family="Georgia,serif" font-size="73" font-weight="700">что спросить</text>
  <text x="78" y="509" fill="#33111c" font-family="Georgia,serif" font-size="73" font-weight="700">у продавца</text>
  <text x="84" y="588" fill="#666d65" font-family="Arial,sans-serif" font-size="27">Три вопроса до оформления заказа</text>

  <g font-family="Arial,sans-serif">
    <rect x="72" y="702" width="856" height="160" rx="22" fill="#fffdf8"/>
    <circle cx="140" cy="782" r="34" fill="#4d1826"/>
    <text x="140" y="791" text-anchor="middle" fill="#fffdf8" font-size="24" font-weight="700">01</text>
    <text x="201" y="773" fill="#222923" font-size="30" font-weight="700">Как точно называется</text>
    <text x="201" y="814" fill="#222923" font-size="30" font-weight="700">сорт в этой партии?</text>

    <rect x="72" y="888" width="856" height="160" rx="22" fill="#fffdf8"/>
    <circle cx="140" cy="968" r="34" fill="#4d1826"/>
    <text x="140" y="977" text-anchor="middle" fill="#fffdf8" font-size="24" font-weight="700">02</text>
    <text x="201" y="959" fill="#222923" font-size="30" font-weight="700">В каком виде приедет</text>
    <text x="201" y="1000" fill="#222923" font-size="30" font-weight="700">растение?</text>

    <rect x="72" y="1074" width="856" height="160" rx="22" fill="#fffdf8"/>
    <circle cx="140" cy="1154" r="34" fill="#4d1826"/>
    <text x="140" y="1163" text-anchor="middle" fill="#fffdf8" font-size="24" font-weight="700">03</text>
    <text x="201" y="1145" fill="#222923" font-size="28" font-weight="700">Откуда партия и чем</text>
    <text x="201" y="1186" fill="#222923" font-size="28" font-weight="700">подтверждено её здоровье?</text>
  </g>

  <path d="M80 1290h840" stroke="#d9ddcf" stroke-width="2"/>
  <text x="82" y="1340" fill="#4d1826" font-family="Arial,sans-serif" font-size="22" font-weight="700">ФОТО УРОЖАЯ НЕ ПОКАЗЫВАЕТ СОСТОЯНИЕ</text>
  <text x="82" y="1375" fill="#4d1826" font-family="Arial,sans-serif" font-size="22" font-weight="700">РАСТЕНИЙ В КОНКРЕТНОЙ ПОСТАВКЕ</text>
  <text x="82" y="1442" fill="#718270" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">МАЛИНА — КЛУБНИКА</text>
</svg>
